name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Prepare Flutter Project
        working-directory: apps/flutter_app
        run: |
          flutter create .
          flutter pub add http

      - name: Patch Android Manifest using xmlstarlet
        working-directory: apps/flutter_app
        run: |
          # تثبيت أداة xmlstarlet
          sudo apt-get update && sudo apt-get install -y xmlstarlet
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # إضافة صلاحية الإنترنت إذا لم تكن موجودة
          if ! xmlstarlet sel -t -v "//uses-permission[@android:name='android.permission.INTERNET']" "$MANIFEST" | grep -q .; then
            xmlstarlet ed -L -N android="http://schemas.android.com/apk/res/android" \
              -i "/manifest" -t elem -n "uses-permission" \
              -i "/manifest/uses-permission[last()]" -t attr -n "android:name" -v "android.permission.INTERNET" "$MANIFEST"
          fi
          
          # إضافة usesCleartextTraffic إلى وسم التطبيق
          if ! xmlstarlet sel -t -v "//application/@android:usesCleartextTraffic" "$MANIFEST" | grep -q "true"; then
            xmlstarlet ed -L -N android="http://schemas.android.com/apk/res/android" \
              -i "/manifest/application" -t attr -n "android:usesCleartextTraffic" -v "true" "$MANIFEST"
          fi
          
          echo "AndroidManifest.xml patched successfully."

      - name: Build APK
        working-directory: apps/flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-suite-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
