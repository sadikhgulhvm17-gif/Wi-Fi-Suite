name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Prepare Flutter Project
        working-directory: apps/flutter_app
        run: |
          flutter create .
          flutter pub add http

      - name: Patch Android Manifest
        working-directory: apps/flutter_app
        run: |
          # نسخ ملف المانيفست المخصص (الذي يحتوي على الصلاحيات)
          cp custom_AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          echo "AndroidManifest.xml patched successfully."

      - name: Build APK
        working-directory: apps/flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-suite-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
